<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Network Guard Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
    .pulse { animation: pulse 1.5s infinite; }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.6; }
    }
  </style>
</head>

<body class="p-6 bg-gray-100 min-h-screen">
  <div class="max-w-6xl mx-auto">
    <!-- Header -->
    <header class="flex justify-between items-center py-4 border-b border-gray-300 mb-8">
      <h1 class="text-3xl font-bold text-gray-800">Network Guard Dashboard</h1>
      <nav>
        <a href="/" class="text-lg font-semibold text-blue-600 hover:text-blue-800 p-2 bg-blue-100 rounded-lg">
          Home (Alerts)
        </a>
        <a href="/logs" class="ml-4 text-lg font-semibold text-gray-600 hover:text-blue-600 p-2 rounded-lg">
          Decrypted Logs
        </a>
      </nav>
    </header>

    <!-- Alerts -->
    <div class="bg-white p-6 rounded-xl shadow-2xl border border-gray-200">
      <h2 class="text-2xl font-semibold mb-6 text-gray-700">Live Security Alert Feed</h2>

      <div id="alert-feed" class="space-y-4 h-96 overflow-y-auto p-4 bg-gray-50 border border-gray-200 rounded-lg">
        <p class="text-gray-500 italic">Waiting for the first alert...</p>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const alertFeed = document.getElementById("alert-feed");
      const eventSource = new EventSource("{{ url_for('stream_alerts') }}");
      console.log("🔗 Connected to alert stream...");

      eventSource.onmessage = (e) => {
        const first = alertFeed.querySelector("p.italic");
        if (first) first.remove();

        const raw = e.data.trim();
        if (!raw || raw.startsWith("⚠️")) return;

        // Extract color prefix: "RED::message" or "BLUE::message"
        const [color, message] = raw.split("::");
        const alertBox = document.createElement("div");
        alertBox.classList.add(
          "p-4",
          "shadow-md",
          "rounded-lg",
          "flex",
          "items-start",
          "gap-3",
          "transition",
          "hover:scale-[1.02]",
          "duration-150"
        );

        if (color === "RED") {
          // 🛡️ IDS ALERT STYLE
          alertBox.classList.add("border-l-8", "border-red-600", "bg-red-50");
          alertBox.innerHTML = `
            <span class="pulse text-red-600 text-xl">🛡️</span>
            <div>
              <p class="font-semibold text-red-700">[IDS ALERT]</p>
              <p class="text-sm text-gray-800 font-mono">${message}</p>
            </div>`;
        } else if (color === "BLUE") {
          // 🧩 DLP ALERT STYLE
          alertBox.classList.add("border-l-8", "border-blue-600", "bg-blue-50");
          alertBox.innerHTML = `
            <span class="text-blue-600 text-xl">🧩</span>
            <div>
              <p class="font-semibold text-blue-700">[DLP ALERT]</p>
              <p class="text-sm text-gray-800 font-mono">${message}</p>
            </div>`;
        } else {
          // fallback for any unknown type
          alertBox.classList.add("border-l-8", "border-gray-400", "bg-gray-100");
          alertBox.innerHTML = `
            <span class="text-gray-600 text-xl">ℹ️</span>
            <div>
              <p class="font-semibold text-gray-700">[SYSTEM]</p>
              <p class="text-sm text-gray-800 font-mono">${message}</p>
            </div>`;
        }

        alertFeed.prepend(alertBox);

        // Limit number of alerts shown
        while (alertFeed.children.length > 40) {
          alertFeed.removeChild(alertFeed.lastChild);
        }
      };

      eventSource.onerror = (err) => {
        console.error("❌ SSE Connection Error:", err);
        const errorMsg = document.createElement("div");
        errorMsg.className =
          "p-4 bg-red-500 text-white rounded-lg shadow-md font-semibold";
        errorMsg.textContent =
          "❌ Lost connection to alert stream. Check Flask terminal.";
        alertFeed.prepend(errorMsg);
        eventSource.close();
      };
    });
  </script>
</body>
</html>
